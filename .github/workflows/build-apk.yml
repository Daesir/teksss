name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Siapkan folder www
        run: |
          test -f index.html || { echo "index.html tidak ditemukan di root repo"; exit 1; }
          SIZE=$(wc -c < index.html)
          echo "Ukuran index.html: $SIZE byte"
          if [ "$SIZE" -lt 50000 ]; then echo "index.html terlalu kecil, kemungkinan versi lama"; exit 1; fi
          mkdir www
          cp index.html www/
      - name: Pasang Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Sidang Nalar" io.github.daesir.sidangnalar --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sidang-nalar-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
